<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Gorilla Garage Door</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;900&family=Barlow+Condensed:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .error-section {
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      background-color: #f8f9fa;
    }
    .error-code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 120px;
      color: var(--primary); /* Uses your existing red/accent color */
      margin: 0;
      line-height: 1;
    }
    .error-title {
      font-family: 'Barlow Condensed', sans-serif;
      font-size: 40px;
      text-transform: uppercase;
      margin: 10px 0 20px;
      color: #111;
    }
    .error-desc {
      font-family: 'Barlow', sans-serif;
      font-size: 18px;
      color: #555;
      max-width: 500px;
      margin-bottom: 30px;
    }
  </style>
</head>
<body>

  <section class="error-section">
    <h1 class="error-code">404</h1>
    <h2 class="error-title">Oops! Page Not Found</h2>
    <p class="error-desc">It looks like this page has gone off the tracks. The link might be broken, or you may have typed the address incorrectly.</p>
    <a href="/" class="btn-primary" style="text-decoration: none;">RETURN TO HOMEPAGE</a>
  </section>

</body>
</html>
